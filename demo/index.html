<!DOCTYPE html>
<!--
    GridMapper - London Boroughs Demo
    
    This example demonstrates the GridMapper API with London boroughs data.
    It shows the original map and grid cartogram side-by-side, allowing users
    to adjust configuration parameters and see instant updates.
    
     To run this example:
     1. No build required — the example imports the local `src/index.js` (ES Module). Note: this will use local source files, so serve the repository root directory when running the example.
     2. Serve this directory with a web server (required for ES modules and CORS):
         - Python: python -m http.server 8000
         - Node: npx http-server -p 8000
         - Or use any other web server
     3. Open http://localhost:8000/example/index.html in your browser
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridMapper Cartogram Demo</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "polylabel": "https://esm.sh/polylabel@1.1.0"
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div id="error-container"></div>

        <div class="data-section">
            <h3>Data Source</h3>
            <div class="data-section-content">
                <div class="file-upload-wrapper">
                    <input type="file" id="file-upload" accept=".geojson,.json" />
                </div>
                <div class="file-info" id="file-info">Using default: london.geojson</div>
                <button id="reset-data" class="reset-button" disabled>Reset to Default</button>
            </div>
        </div>

        <div class="maps-container">
            <div class="map-panel">
                <h2>Original Map</h2>
                <div class="map-container" id="original-map"></div>
            </div>
            <div class="map-panel">
                <h2>Grid Cartogram</h2>
                <div class="map-container" id="grid-map"></div>
            </div>
        </div>
        <div class="controls">
            <div class="controls-grid">
                <div class="control-section">
                    <div class="control-section-title">Grid Configuration</div>
                    <div class="control-group">
                        <label for="grid-type">Grid Type</label>
                        <select id="grid-type">
                            <option value="rect">Rectangular</option>
                            <option value="hex">Hexagonal</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="rows">Grid Rows</label>
                        <input type="number" id="rows" min="1" max="100" value="6">
                    </div>
                    <div class="control-group">
                        <label for="cols">Grid Columns</label>
                        <input type="number" id="cols" min="1" max="100" value="6">
                    </div>
                </div>

                <div class="control-section">
                    <div class="control-section-title">Allocation Settings</div>
                    <div class="control-group">
                        <label for="compactness">Compactness</label>
                        <input type="range" id="compactness" min="0" max="1" step="0.05" value="0.5">
                        <span class="value-display" id="compactness-value">0.5</span>
                    </div>
                    <div class="control-group">
                        <label for="distance-metric">Distance Metric</label>
                        <select id="distance-metric">
                            <option value="euclidean">Euclidean</option>
                            <option value="manhattan">Manhattan</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="rotate-pca">
                            <input type="checkbox" id="rotate-pca"> Rotate by PCA
                        </label>
                    </div>
                </div>
                <div class="control-section">
                    <div class="control-section-title">Edit Mode</div>
                    <div class="control-group">
                        <label for="edit-mode">
                            <input type="checkbox" id="edit-mode"> Enable visual edit mode
                        </label>
                    </div>
                    <div class="control-group">
                        <button id="reset-edits" class="reset-button" disabled>Reset Edits</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="status" id="status">
            <strong>Status:</strong> <span id="status-text">Loading...</span>
            <button id="export-geojson" class="export-button" disabled>Export GeoJSON</button>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script type="module" src="app.js"></script>
</body>

</html>
